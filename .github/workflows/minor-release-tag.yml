name: Release line

# Moves the release line (the v0.1-branch branch and the v0.1 tag) to each
# patch release (v0.1.1) when it is published, so configs that pin the release
# line get it on their next build. Configs pin the branch: west skips fetching
# a tag it already has, so builds that restore a cached west workspace (ZMK's
# build-user-config.yml) never see a moved tag. The tag is kept for configs
# that pinned it earlier.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  move:
    if: ${{ github.repository == 'rleyvasal/zmk-studio-log' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Move the release line
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "$TAG is not a vX.Y.Z release; nothing to move."
            exit 0
          fi
          minor="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          latest="$(git tag --list "${minor}.*" --sort=-v:refname | head -1)"
          if [ "$latest" != "$TAG" ]; then
            echo "$TAG is older than $latest; leaving $minor alone."
            exit 0
          fi
          # Branch first, fast-forward only: a release line never rewinds, and
          # a rejected push leaves the tag alone too.
          git push origin "$(git rev-parse "$TAG^{commit}"):refs/heads/${minor}-branch"
          git tag -f "$minor" "$TAG^{commit}"
          git push -f origin "refs/tags/$minor"
          echo "$minor -> $TAG"
